name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for merge conflict markers
        run: |
          if grep -rEn '^<{7}|^={7}$|^>{7}' --include='*.md' --include='*.yaml' --include='*.yml' .; then
            echo "::error::Merge conflict markers found in tracked files"
            exit 1
          fi

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@db4f21d88e3e17bde9e1738d893df498da0bfbca # v19.1.0
        with:
          globs: "**/*.md"

      - name: Check links
        uses: lycheeverse/lychee-action@f613c4a64e50d792e0b31ec34bbcbba12263c6a1 # v2.3.0
        with:
          args: --no-progress --exclude-path .git '**/*.md'
          fail: true
